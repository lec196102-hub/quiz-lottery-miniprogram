<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答题抽奖小程序 · 可交互原型</title>
<style>
:root{
  --c-primary:#185FA5; --c-primary-bg:#E6F1FB;
  --c-success:#3B6D11; --c-success-bg:#EAF3DE;
  --c-warn:#854F0B; --c-warn-bg:#FAEEDA;
  --c-danger:#A32D2D; --c-danger-bg:#FCEBEB;
  --c-text:#1a1a1a; --c-text2:#5F5E5A; --c-text3:#888780;
  --c-border:#e3e3e0; --c-bg:#f1efe8; --c-surface:#ffffff;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--c-bg);color:var(--c-text);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px}
input,select,textarea{font-family:inherit;font-size:14px}
table{width:100%;border-collapse:collapse}

/* ============ 顶栏 ============ */
.topbar{position:sticky;top:0;z-index:100;background:var(--c-surface);border-bottom:1px solid var(--c-border);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:15px;font-weight:600}
.topbar .sub{font-size:12px;color:var(--c-text3)}
.seg{display:flex;background:var(--c-bg);border-radius:8px;padding:2px}
.seg button{padding:6px 14px;border-radius:6px;font-size:13px;color:var(--c-text2)}
.seg button.on{background:var(--c-surface);color:var(--c-text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.spacer{flex:1}
.btn{padding:7px 14px;border-radius:8px;font-size:13px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text)}
.btn:hover{background:var(--c-bg)}
.btn.primary{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.btn.primary:hover{background:#124d87}
.btn.on{background:var(--c-primary-bg);border-color:var(--c-primary);color:var(--c-primary)}
.pages-nav{display:flex;gap:4px;flex-wrap:wrap}
.pages-nav button{padding:5px 10px;border-radius:6px;font-size:12px;color:var(--c-text2);border:1px solid transparent}
.pages-nav button:hover{background:var(--c-bg)}
.pages-nav button.on{background:var(--c-primary-bg);color:var(--c-primary);border-color:var(--c-primary)}

/* ============ 舞台 ============ */
.stage{display:flex;gap:24px;padding:24px 20px 40px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.phone{width:390px;background:#1a1a1a;border-radius:44px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);flex-shrink:0}
.phone-screen{width:366px;height:760px;background:#f7f8fa;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.statusbar{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:12px;color:#1a1a1a;flex-shrink:0;background:#f7f8fa}
.navbar{height:44px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--c-surface);border-bottom:1px solid var(--c-border);flex-shrink:0}
.navbar .back{position:absolute;left:12px;font-size:20px;color:var(--c-text);line-height:1}
.navbar .title{font-size:16px;font-weight:500}
.page-body{flex:1;overflow-y:auto;padding:16px}
.page-body::-webkit-scrollbar{width:4px}
.page-body::-webkit-scrollbar-thumb{background:#d0d0cc;border-radius:2px}
.tabbar{height:56px;background:var(--c-surface);border-top:1px solid var(--c-border);display:flex;flex-shrink:0}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--c-text3)}
.tabbar button.on{color:var(--c-primary)}
.tabbar .dot{width:18px;height:18px;border-radius:5px;background:currentColor;opacity:.5;margin-bottom:1px}

/* ============ 后台 ============ */
.pc{width:1180px;max-width:100%;background:var(--c-surface);border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06);flex-shrink:0}
.pc.slim{width:420px}
.admin-layout{display:flex;min-height:700px}
.admin-side{width:180px;background:#2C2C2A;color:#D3D1C7;padding:16px 0;flex-shrink:0;display:flex;flex-direction:column}
.admin-side .logo{padding:0 16px 16px;font-size:14px;font-weight:600;color:#fff;border-bottom:1px solid #444441;margin-bottom:8px}
.admin-side a{display:block;padding:10px 16px;color:#B4B2A9;font-size:13px;text-decoration:none}
.admin-side a:hover{background:#3a3a37;color:#fff}
.admin-side a.on{background:var(--c-primary);color:#fff}
.admin-main{flex:1;padding:20px;overflow-y:auto;max-height:700px;background:#fafaf9}
.admin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.admin-head h2{font-size:16px;font-weight:600}

/* ============ 通用组件 ============ */
.card{background:var(--c-surface);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--c-border)}
.card.flat{border:none;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.muted{color:var(--c-text2)}
.tiny{font-size:12px}
.center{text-align:center}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.gap12{gap:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--c-text2);margin-bottom:6px}
.field input{width:100%;padding:10px 12px;border:1px solid var(--c-border);border-radius:8px;background:var(--c-surface)}
.field input:focus{outline:none;border-color:var(--c-primary)}
.field .err{color:var(--c-danger);font-size:12px;margin-top:4px;display:none}
.field.invalid input{border-color:var(--c-danger)}
.field.invalid .err{display:block}

.btn-block{width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:500}
.btn-lg{padding:12px 20px;border-radius:10px;font-size:15px}

.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;line-height:1.7}
.badge.blue{background:var(--c-primary-bg);color:var(--c-primary)}
.badge.green{background:var(--c-success-bg);color:var(--c-success)}
.badge.amber{background:var(--c-warn-bg);color:var(--c-warn)}
.badge.red{background:var(--c-danger-bg);color:var(--c-danger)}
.badge.gray{background:#F1EFE8;color:var(--c-text2)}

/* 四态 */
.empty{padding:48px 20px;text-align:center;color:var(--c-text3)}
.empty .icon{width:56px;height:56px;border-radius:16px;background:#F1EFE8;margin:0 auto 12px}
.empty .t{font-size:14px;color:var(--c-text2);margin-bottom:4px}
.empty .d{font-size:12px;margin-bottom:16px}
.skel{background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:6px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-line{height:14px;margin-bottom:10px}
.skel-box{height:80px;margin-bottom:12px}
.loading-mask{position:absolute;inset:0;background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:12px}
.spinner{width:36px;height:36px;border:3px solid #e3e3e0;border-top-color:var(--c-primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.form-error{background:var(--c-danger-bg);border:1px solid #F7C1C1;color:var(--c-danger);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}

/* 题目 */
.q-progress{display:flex;gap:4px;margin-bottom:16px}
.q-progress i{flex:1;height:4px;border-radius:2px;background:#e3e3e0}
.q-progress i.done{background:var(--c-primary)}
.q-progress i.cur{background:var(--c-primary)}
.q-title{font-size:16px;line-height:1.6;margin-bottom:4px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:14px;border:1px solid var(--c-border);border-radius:10px;margin-bottom:10px;background:var(--c-surface);text-align:left;width:100%}
.opt:active{background:#f5f5f5}
.opt.sel{border-color:var(--c-primary);background:var(--c-primary-bg)}
.opt .k{width:24px;height:24px;border-radius:50%;border:1px solid var(--c-border);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;background:#fff}
.opt.sel .k{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.opt.correct{border-color:var(--c-success);background:var(--c-success-bg)}
.opt.wrong{border-color:var(--c-danger);background:var(--c-danger-bg)}

/* 抽奖转盘 */
.wheel-wrap{position:relative;width:260px;height:260px;margin:20px auto}
.wheel{width:100%;height:100%;border-radius:50%;border:8px solid #fff;box-shadow:0 4px 20px rgba(0,0,0,.12);position:relative;overflow:hidden}
.wheel.spin{transition:transform 4s cubic-bezier(.15,.85,.35,1)}
.wheel-item{position:absolute;left:50%;top:50%;width:50%;height:0;transform-origin:0 0}
.wheel-item span{position:absolute;left:64px;top:-9px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.pointer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:var(--c-surface);border:4px solid var(--c-primary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--c-primary);z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.15)}

/* 结果弹层 */
.result-pop{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:24px}
.result-card{background:var(--c-surface);border-radius:20px;padding:28px 24px;text-align:center;width:100%}
.prize-icon{width:72px;height:72px;border-radius:20px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:30px}
.level-1{background:#FAEEDA}.level-2{background:#E6F1FB}.level-3{background:#EAF3DE}.level-0{background:#F1EFE8}

/* Toast */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#2C2C2A;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.ok{background:var(--c-success)}
.toast.err{background:var(--c-danger)}

/* 后台表格 */
.tbl{font-size:13px}
.tbl th{background:#fafaf9;text-align:left;padding:10px 12px;color:var(--c-text2);font-weight:500;border-bottom:1px solid var(--c-border);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid #f0f0ee;vertical-align:middle}
.tbl tr:hover td{background:#fafaf9}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#fafaf9;border:1px solid var(--c-border);border-radius:10px;padding:14px}
.stat .n{font-size:22px;font-weight:600;line-height:1.2}
.stat .l{font-size:12px;color:var(--c-text2);margin-top:2px}
.bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c-primary);border-radius:4px}

/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200}
.modal-box{background:var(--c-surface);border-radius:12px;width:520px;max-width:92vw;max-height:84vh;overflow:auto}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--c-border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:15px;font-weight:600}
.modal-body{padding:20px}
.modal-foot{padding:12px 20px;border-top:1px solid var(--c-border);display:flex;justify-content:flex-end;gap:8px}
.drop{border:2px dashed var(--c-border);border-radius:10px;padding:28px;text-align:center;color:var(--c-text3);cursor:pointer}
.drop:hover{border-color:var(--c-primary);background:var(--c-primary-bg)}
.switch{width:40px;height:22px;border-radius:11px;background:#d0d0cc;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.switch.on{background:var(--c-primary)}
.switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{left:20px}

/* 标注面板 */
.anno{width:320px;flex-shrink:0}
.anno-box{background:var(--c-surface);border-radius:var(--radius);padding:16px;border:1px solid var(--c-border);margin-bottom:12px}
.anno-box h4{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--c-text);display:flex;align-items:center;gap:6px}
.anno-box h4::before{content:'';width:3px;height:13px;background:var(--c-primary);border-radius:2px}
.anno-kv{display:flex;gap:8px;font-size:12px;margin-bottom:6px}
.anno-kv b{color:var(--c-text2);font-weight:400;flex-shrink:0;width:52px}
.anno-kv span{color:var(--c-text);flex:1}
.anno ul{list-style:none;font-size:12px}
.anno ul li{padding:5px 0 5px 12px;position:relative;color:var(--c-text2);border-bottom:1px dashed #f0f0ee}
.anno ul li:last-child{border-bottom:none}
.anno ul li::before{content:'';position:absolute;left:0;top:12px;width:4px;height:4px;border-radius:50%;background:var(--c-primary)}
.anno ul li b{color:var(--c-text);font-weight:500}

/* 调试面板 */
.debug{width:320px;flex-shrink:0}
.debug-box{background:#2C2C2A;color:#D3D1C7;border-radius:var(--radius);padding:14px;margin-bottom:12px}
.debug-box h4{font-size:12px;color:#fff;margin-bottom:10px;letter-spacing:.5px}
.debug-box button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;font-size:12px;color:#D3D1C7;margin-bottom:4px;background:#3a3a37}
.debug-box button:hover{background:#4a4a47;color:#fff}
.debug-box button.act{background:var(--c-danger);color:#fff}
.debug-box .hint{font-size:11px;color:#888780;line-height:1.5;margin-top:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header class="topbar">
  <div>
    <h1>答题抽奖小程序 · 可交互原型</h1>
    <div class="sub">低保真线框实现 · 覆盖 12 个页面与空/加载/报错/成功四态</div>
  </div>
  <div class="seg" id="segClient">
    <button data-side="c" data-action="switch-side" class="on">参与者端（小程序）</button>
    <button data-side="a" data-action="switch-side">管理后台（PC）</button>
  </div>
  <div class="pages-nav" id="pageNav"></div>
  <div class="spacer"></div>
  <button class="btn" id="btnAnno">设计标注</button>
  <button class="btn" id="btnDebug">测试面板</button>
</header>

<div class="stage">
  <div id="viewport"></div>
  <div id="sidePanels" style="display:flex;gap:12px;flex-wrap:wrap"></div>
</div>

<div class="toast" id="toast"></div>
<h2 class="sr-only">答题抽奖小程序可交互原型，包含参与者端 7 个页面与管理后台 5 个页面</h2>

<script type="module">
(function(){
/* === test_data.js (inlined) === */
/**

const  ACTIVITY = {

};

/* ============================================================
 * 2. 题库  → question 表（150 道单选题）
 * 字段：no, category, title, options{A,B,C,D}, answer, analysis, enabled
 * ==========================================================*/
const  QUESTIONS = [

  /* ---------- 安全生产 ---------- */
  { no: 1, category: '安全生产', title: '我国安全生产工作的方针是？', options: { A: '效益优先、兼顾安全', B: '生产第一、安全第二', C: '安全第一、预防为主、综合治理', D: '谁主管、谁负责' }, answer: 'C', analysis: '《安全生产法》第三条确立"安全第一、预防为主、综合治理"的方针。', enabled: true },

  { no: 3, category: '安全生产', title: '新员工三级安全教育是指？', options: { A: '公司、车间、班组', B: '国家、省、市', C: '理论、实操、考核', D: '入职、转正、年度' }, answer: 'A', analysis: '三级安全教育指厂（公司）级、车间（部门）级、班组级。', enabled: true },
  { no: 4, category: '安全生产', title: '从业人员发现直接危及人身安全的紧急情况时，有权？', options: { A: '停止作业并撤离现场', B: '继续作业等待指令', C: '自行处理后再汇报', D: '征求同事意见' }, answer: 'A', analysis: '《安全生产法》第五十五条规定，从业人员有权停止作业或在采取可能的应急措施后撤离。', enabled: true },
  { no: 5, category: '安全生产', title: '特种作业人员必须取得（ ）方可上岗。', options: { A: '特种作业操作证', B: '健康证明', C: '学历证书', D: '岗位培训证明' }, answer: 'A', analysis: '特种作业人员须经专门培训并考核合格，取得特种作业操作证。', enabled: true },

  { no: 7, category: '安全生产', title: '安全色中红色表示？', options: { A: '指令', B: '禁止、停止', C: '警告', D: '提示' }, answer: 'B', analysis: '红色表示禁止、停止、消防和危险。', enabled: true },

 *
 * 职责边界：

/* ============================================================
 * 0. 基础工具
 * ==========================================================*/

const ACTIVITY_ID = '2026-safety-quiz';
const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const now = () => {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
};

/** 可审计的公平随机：优先使用 crypto，不可用时退回 Math.random */
function secureRandom() {
  const c = globalThis.crypto;
  if (c && typeof c.getRandomValues === 'function') {
    const buf = new Uint32Array(1);
    c.getRandomValues(buf);
    return buf[0] / 4294967296;
  }
  return Math.random();
}

/** 题干归一化哈希，用于导入去重（与后端 content_hash 对齐） */
function contentHash(text) {
  const s = String(text).replace(/\s+/g, '').trim();
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return `h${(h >>> 0).toString(36)}`;
}

function clone(v) {
  return JSON.parse(JSON.stringify(v));
}

/** 业务异常：携带错误码，供上层按类型渲染不同报错态 */
class  BizError extends Error {
  constructor(message, code = 'BIZ_ERROR', detail = null) {
    super(message);
    this.name = 'BizError';
    this.code = code;
    this.detail = detail;
  }
}

/* ============================================================
 * 1. 运行时状态（静态数据的可变副本，静态数据本身永不被修改）
 * ==========================================================*/

function buildInitialState() {
  // 依据已有的中奖记录反推奖品池剩余量，保证「发出 + 剩余 = 总量」在初始态即成立
  const issued = LOTTERY_RECORDS.reduce((m, r) => {
    if (r.level) m[r.level] = (m[r.level] || 0) + 1;
    return m;
  }, {});

  return {
    activity: { ...ACTIVITY, _id: ACTIVITY_ID },
    questions: QUESTIONS.map((q, i) => ({
      _id: `q_${q.no}`,
      activityId: ACTIVITY_ID,
      contentHash: contentHash(q.title),
      createdAt: now(),
      ...q
    })),
    prizes: PRIZES.map((p) => ({
      _id: `p_${p.level}`,
      activityId: ACTIVITY_ID,
      updatedAt: now(),
      ...p,
      remain: Math.max(0, p.total - (issued[p.level] || 0))
    })),
    participants: PARTICIPANTS.map((p, i) => ({
      _id: `u_${i + 1}`,
      activityId: ACTIVITY_ID,
      createdAt: now(),
      ...p
    })),
    lotteryRecords: LOTTERY_RECORDS.map((r, i) => ({
      _id: `l_${i + 1}`,
      activityId: ACTIVITY_ID,
      ...r
    })),
    examRecords: EXAM_RECORDS.map((r, i) => ({ _id: `e_${i + 1}`, activityId: ACTIVITY_ID, ...r })),
    admins: ADMINS.map((a, i) => ({ _id: `a_${i + 1}`, ...a })),
    session: null, // 当前登录的参与者
    adminSession: null, // 当前登录的管理员
    seq: 1000
  };
}

let state = buildInitialState();
const nextId = (prefix) => `${prefix}_${++state.seq}`;

/**
 * 批量导入题库
 * @param {Array} rows  形如 [{题号,题干,选项A,选项B,选项C,选项D,正确答案,解析}]
 * @param {string} mode append | overwrite | skip
 * @returns {{total:number, success:number, failed:number, errors:Array}}
 */
async function  importQuestions(rows, mode = 'append') {
  await delay(900); // 模拟服务端解析 + 校验耗时，用于展示加载态

  if (!Array.isArray(rows) || rows.length === 0) {
    throw new BizError('导入内容为空，请检查文件', 'EMPTY_FILE');
  }

  if (mode === 'overwrite') state.questions = [];

  const existingHash = new Set(state.questions.map((q) => q.contentHash));
  const errors = [];
  let success = 0;
  let maxNo = state.questions.reduce((m, q) => Math.max(m, q.no), 0);

  rows.forEach((row, i) => {
    const lineNo = i + 2; // 表头占第 1 行
    const title = String(row.题干 ?? '').trim();
    const answer = String(row.正确答案 ?? '').trim().toUpperCase();

    if (!title) return errors.push({ lineNo, reason: '题干为空' });
    if (!['A', 'B', 'C', 'D'].includes(answer)) return errors.push({ lineNo, reason: `正确答案非法：${answer || '空'}` });

    const options = {
      A: String(row.选项A ?? '').trim(),
      B: String(row.选项B ?? '').trim(),
      C: String(row.选项C ?? '').trim(),
      D: String(row.选项D ?? '').trim()
    };
    const emptyOpt = Object.entries(options).find(([, v]) => !v);
    if (emptyOpt) return errors.push({ lineNo, reason: `选项 ${emptyOpt[0]} 为空` });
    if (new Set(Object.values(options)).size !== 4) return errors.push({ lineNo, reason: '存在重复选项' });

    const hash = contentHash(title);
    if (existingHash.has(hash)) {
      if (mode === 'skip') return errors.push({ lineNo, reason: '题干重复，已跳过' });
      return errors.push({ lineNo, reason: `题干与第 ${state.questions.find((q) => q.contentHash === hash).no} 题重复` });
    }

    existingHash.add(hash);
    maxNo += 1;
    state.questions.push({
      _id: `q_${maxNo}`,
      activityId: ACTIVITY_ID,
      no: maxNo,
      category: String(row.分类 ?? '未分类').trim() || '未分类',
      title,
      options,
      answer,
      analysis: String(row.解析 ?? '').trim(),
      enabled: true,
      contentHash: hash,
      createdAt: now()
    });
    success += 1;
  });

  return { total: rows.length, success, failed: errors.length, errors };
}

/** 随机抽题：不下发正确答案 */
async function  drawQuestions() {
  await delay(520);

  const cfg = state.activity;
  if (cfg.status !== 'open') throw new BizError('活动未开始或已结束', 'ACTIVITY_CLOSED');

  const pool = state.questions.filter((q) => q.enabled);
  if (pool.length < cfg.questionCount) {
    throw new BizError(`可用题目不足，当前仅 ${pool.length} 题`, 'POOL_SHORTAGE');
  }

  // Fisher-Yates 部分洗牌，取前 N 题
  const arr = [...pool];
  for (let i = 0; i < cfg.questionCount; i++) {
    const j = i + Math.floor(secureRandom() * (arr.length - i));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  const picked = arr.slice(0, cfg.questionCount);

  return picked.map((q) => ({
    _id: q._id,
    no: q.no,
    title: q.title,
    category: q.category,
    options: clone(q.options)
  }));
}

/** 交卷判分：服务端比对，不信任前端 */
async function  submitExam(questionNos, answers) {
  await delay(680);

  const p = state.participants.find((x) => x._id === state.session);
  if (!p) throw new BizError('请先登记身份信息', 'NOT_REGISTERED');

  if (!Array.isArray(questionNos) || !Array.isArray(answers) || questionNos.length !== answers.length) {
    throw new BizError('作答数据不完整', 'INVALID_PAYLOAD');
  }

  const details = questionNos.map((no, i) => {
    const q = state.questions.find((x) => x.no === Number(no));
    return { no: Number(no), yourAnswer: answers[i], correctAnswer: q ? q.answer : '', correct: !!q && q.answer === answers[i] };
  });

  const correctCount = details.filter((d) => d.correct).length;
  const passed = correctCount >= state.activity.passScore;

  if (passed && !p.passed) {
    p.passed = true;
    p.passedAt = now();
  }

  state.examRecords.push({
    _id: nextId('e'),
    activityId: ACTIVITY_ID,
    empNo: p.empNo,
    questionNos: questionNos.map(Number),
    answers,
    correctCount,
    passed,
    submittedAt: now()
  });

  return {
    correctCount,
    total: questionNos.length,
    passed,
    passScore: state.activity.passScore,
    details: details.map((d) => {
      const q = state.questions.find((x) => x.no === d.no);
      return { ...d, title: q?.title ?? '', analysis: q?.analysis ?? '', options: clone(q?.options ?? {}) };
    }),
    participant: clone(p)
  };
}

/* ============================================================
 * 6. 抽奖引擎（核心，与 PRD 附录 A 一一对应）
 * ==========================================================*/

/** 固定权重模式下的一/二/三等奖权重（weightMode = 'fixed' 时使用） */
const FIXED_WEIGHT = { 1: 1, 2: 8, 3: 16 };

function prizeWeight(prize, mode) {
  if (mode === 'fixed') return prize.weight > 0 ? prize.weight : FIXED_WEIGHT[prize.level] ?? 1;
  if (mode === 'initial') return prize.total;
  return prize.remain; // remain（默认）：按剩余库存加权
}

function weightedPick(pool, mode) {
  const weights = pool.map((p) => prizeWeight(p, mode));
  const sum = weights.reduce((a, b) => a + b, 0);
  if (sum <= 0) return pool[Math.floor(secureRandom() * pool.length)];
  let r = secureRandom() * sum;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r < 0) return pool[i];
  }
  return pool[pool.length - 1];
}

/** 条件原子扣减：生产环境为 UPDATE ... WHERE remain > 0，此处以同步单线程等价模拟 */
function atomicDecrement(level) {
  const prize = state.prizes.find((p) => p.level === level);
  if (!prize || prize.remain <= 0) return false;
  prize.remain -= 1;
  prize.updatedAt = now();
  return true;
}

}

/**
 * 执行抽奖
 * @returns {{won:boolean, level:number|null, prizeName:string|null, message:string, poolEmpty:boolean}}
 */
async function  drawLottery() {
  await delay(1400); // 留出抽奖动画时间

  const p = state.participants.find((x) => x._id === state.session);
  if (!p) throw new BizError('请先登记身份信息', 'NOT_REGISTERED');
  if (!p.passed) throw new BizError('答题未通关，暂无抽奖资格', 'NOT_PASSED');
  if (p.drawn) {
    const old = state.lotteryRecords.find((r) => r.empNo === p.empNo);
    throw new BizError('每人仅可参与一次抽奖', 'ALREADY_DRAWN', old);
  }

  const cfg = state.activity;

  // 奖池是否整体抽空
  const poolEmpty = state.prizes.every((x) => x.remain <= 0);
  if (poolEmpty && cfg.poolEmptyBehavior === 'close') {
    throw new BizError('奖品已全部送出，感谢参与！', 'POOL_EMPTY');
  }

  // 阶段一：中奖判定，恒定 winRate
  const r1 = secureRandom();
  let level = null;
  let prizeName = null;
  let message = '谢谢参与';

  if (r1 < cfg.winRate) {
    // 阶段二 + 三：加权选等级 + 原子扣减，失败则剔除该等级后重试，最多 3 次
    let pool = state.prizes.filter((x) => x.remain > 0);
    for (let attempt = 0; attempt < 3 && pool.length > 0; attempt++) {
      const picked = weightedPick(pool, cfg.weightMode);
      if (atomicDecrement(picked.level)) {
        level = picked.level;
        prizeName = `${picked.name} · ${picked.desc}`;
        message = `恭喜获得${picked.name}`;
        break;
      }
      pool = pool.filter((x) => x.level !== picked.level);
    }
    if (level === null) message = '谢谢参与'; // 并发耗尽，降级
  }

  // 写入中奖记录（唯一性由 (activityId, empNo) 保证）
  p.drawn = true;
  p.drawnAt = now();
  const wonAt = now();
  state.lotteryRecords.push({
    _id: nextId('l'),
    activityId: ACTIVITY_ID,
    participantId: p._id,
    name: p.name,
    empNo: p.empNo,
    level,
    prizeName,
    wonAt,
    remark: level ? '' : '谢谢参与'
  });

  return { won: level !== null, level, prizeName, message, wonAt, poolEmpty: state.prizes.every((x) => x.remain <= 0) };
}

/* ============================================================
 * 8. 测试工具（仅供《测试方案》验证使用，生产环境移除）
 * ==========================================================*/

const  TEST_UTILS = {
  /** 重置全部运行时状态到初始态 */
  reset() {
    state = buildInitialState();
  },

  /** 快照当前奖品池 */
  snapshotPool() {
    return clone(state.prizes);
  },

  /**
   * 批量模拟抽奖，用于验证中奖率与库存扣减。
   * 注意：为绕过"一人一次"限制，直接操作状态，不走资格校验。
   * @param {number} times 模拟次数
   * @param {number} seed 随机种子（可选，用于复现）
   */
  simulateDraws(times, seed = null) {
    let s = seed;
    const rand = () => {
      if (s === null) return secureRandom();
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };

    // 传入 seed 时使用可复现的线性同余随机，否则使用安全随机
    const __rand = rand;

    const result = { times, won: 0, byLevel: { 1: 0, 2: 0, 3: 0 }, oversold: 0, fallback: 0 };

    for (let i = 0; i < times; i++) {
      const cfg = state.activity;
      const poolEmpty = state.prizes.every((x) => x.remain <= 0);
      if (poolEmpty) break;

      const r1 = __rand();
      if (r1 >= cfg.winRate) continue;

      let pool = state.prizes.filter((x) => x.remain > 0);
      let got = null;
      for (let attempt = 0; attempt < 3 && pool.length > 0; attempt++) {
        const weights = pool.map((p) => prizeWeight(p, cfg.weightMode));
        const sum = weights.reduce((a, b) => a + b, 0);
        let r = __rand() * sum;
        let picked = pool[pool.length - 1];
        for (let k = 0; k < pool.length; k++) {
          r -= weights[k];
          if (r < 0) {
            picked = pool[k];
            break;
          }
        }
        if (atomicDecrement(picked.level)) {
          got = picked.level;
          break;
        }
        pool = pool.filter((x) => x.level !== picked.level);
      }

      if (got) {
        result.won += 1;
        result.byLevel[got] += 1;
      } else {
        result.fallback += 1;
      }
    }

    // 校验超发
    state.prizes.forEach((p) => {
      if (p.remain < 0) result.oversold += Math.abs(p.remain);
      const issued = result.byLevel[p.level] ?? 0;
      if (issued > p.total) result.oversold += issued - p.total;
    });

    result.remain = state.prizes.map((p) => ({ level: p.level, total: p.total, remain: p.remain }));
    result.actualWinRate = result.times ? +(result.won / result.times).toFixed(4) : 0;
    return result;
  },

  /** 直接构造一个已通关、未抽奖的测试身份，供原型快速走通流程 */
  seedParticipant(name, empNo, { passed = true } = {}) {
    let p = state.participants.find((x) => x.empNo === empNo && x.name === name);
    if (!p) {
      p = {
        _id: nextId('u'),
        activityId: ACTIVITY_ID,
        name,
        empNo,
        openid: `o-${empNo.toLowerCase()}`,
        passed: false,
        passedAt: null,
        drawn: false,
        drawnAt: null,
        createdAt: now()
      };
      state.participants.push(p);
    }
    if (passed && !p.passed) {
      p.passed = true;
      p.passedAt = now();
    }
    state.session = p._id;
    return clone(p);
  },

  /** 强制消耗某奖项库存（用于验证"一等奖抽完后再抽不到"） */
  drainPrize(level) {
    const p = state.prizes.find((x) => x.level === Number(level));
    if (p) p.remain = 0;
    return clone(state.prizes);
  }
};

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg, type = '') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => (t.className = 'toast ' + type), 2200);
}

/** 统一请求包装：注入加载态与调试用的强制报错 */
async function call(fn, { loading = null, silent = false } = {}) {
  const setLoading = (text) => {
    const mask = $('#loadingMask');
    if (!mask) return;
    mask.style.display = 'flex';
    mask.querySelector('.loading-text').textContent = text;
  };
  try {
    if (loading) setLoading(loading);
    if (state.forceError) {
      state.forceError = false;
      await new Promise((r) => setTimeout(r, 600));
      throw new BizError('网络连接超时，请检查网络后重试', 'NETWORK');
    }
    return await fn();
  } catch (e) {
    if (e instanceof BizError) {
      if (!silent) toast(e.message, 'err');
    } else {
      if (!silent) toast('请求失败：' + e.message, 'err');
    }
    throw e;
  } finally {
    const mask = $('#loadingMask');
    if (mask) mask.style.display = 'none';
  }
}

const skeleton = (n = 3) =>
  `<div class="skel skel-box"></div>` + Array.from({ length: n }, (_, i) => `<div class="skel skel-line" style="width:${90 - i * 12}%"></div>`).join('');

/** 空状态组件。btn = { action, route, label } */
const emptyState = (title, desc, btn) => `
  <div class="empty">
    <div class="icon"></div>
    <div class="t">${esc(title)}</div>
    <div class="d">${esc(desc)}</div>
    ${btn ? `<button class="btn primary" data-action="${btn.action}"${btn.route ? ` data-route="${btn.route}"` : ''}>${esc(btn.label)}</button>` : ''}
  </div>`;

const loadingMask = () => `<div class="loading-mask" id="loadingMask" style="display:none"><div class="spinner"></div><div class="loading-text tiny muted"></div></div>`;

async function pageQuiz() {
  if (!state.me) return pageRegister({}, '请先登记身份信息后再开始答题');
  try {
    const qs = await call(() => Data.drawQuestions(), { loading: '正在抽题…' });
    state.quiz = { questions: qs, index: 0, answers: new Array(qs.length).fill(null) };
    return renderQuiz();
  } catch {
    return {
      navbar: '答题',
      back: 'home',
      body: `<div class="card">${skeleton(3)}</div>
        <div class="form-error">题目加载失败，请检查网络后重试</div>
        <button class="btn primary btn-block" data-action="goto" data-route="quiz">重新加载</button>`
    };
  }
}

function renderQuiz() {
  const q = state.quiz;
  const item = q.questions[q.index];
  return {
    navbar: `答题 ${q.index + 1}/${q.questions.length}`,
    back: 'home',
    body: `
      <div class="q-progress">${q.questions.map((_, i) => `<i class="${i < q.index ? 'done' : i === q.index ? 'cur' : ''}"></i>`).join('')}</div>
      <div class="card">
        <div class="row between mb12"><span class="badge gray">${esc(item.category)}</span><span class="tiny muted">第 ${item.no} 题</span></div>
        <div class="q-title">${esc(item.title)}</div>
      </div>
      ${['A', 'B', 'C', 'D'].map((k) => `
        <button class="opt ${q.answers[q.index] === k ? 'sel' : ''}" data-action="pick" data-key="${k}">
          <span class="k">${k}</span><span>${esc(item.options[k])}</span>
        </button>`).join('')}
      <div class="row gap12 mt16">
        <button class="btn" style="flex:1;${q.index === 0 ? 'opacity:.4' : ''}" data-action="prev-q" ${q.index === 0 ? 'disabled' : ''}>上一题</button>
        ${q.index < q.questions.length - 1
          ? `<button class="btn primary" style="flex:1" data-action="next-q">下一题</button>`
          : `<button class="btn primary" style="flex:1" data-action="submit-quiz">交卷</button>`}
      </div>
      <div class="tiny muted center mt12">本页不包含正确答案，判分在服务端完成</div>`
  };
}

    navbar: '答题结果',
    back: 'home',
    body: `
      <div class="card center" style="background:${r.passed ? 'var(--c-success-bg)' : 'var(--c-warn-bg)'};border:none">
        <div style="font-size:32px;font-weight:600;color:${r.passed ? 'var(--c-success)' : 'var(--c-warn)'}">${r.correctCount} / ${r.total}</div>
        <div class="tiny" style="color:${r.passed ? 'var(--c-success)' : 'var(--c-warn)'}">${r.passed ? '恭喜通关，获得抽奖资格' : `答对 ${r.passScore} 题即可通关`}</div>
      </div>
      ${r.passed

        <div class="tiny muted mb12">答案解析</div>
        ${r.details.map((d, i) => `
          <div class="mb12" style="padding-bottom:12px;border-bottom:1px solid var(--c-border)">

                ${k}. ${esc(d.options[k])}${k === d.correctAnswer ? ' ✓' : ''}${k === d.yourAnswer && !d.correct ? ' ✗' : ''}

          </div>`).join('')}
      </div>`
  };

async function pageLottery() {
  if (!state.me) return pageRegister({}, '请先登记身份信息');
  const elig = await Data.getEligibility();
  const stats = await Data.getStats();
  const poolEmpty = stats.prizeRemain === 0;

  if (!elig.passed) {
    return { navbar: '抽奖', back: 'home', body: emptyState('尚未获得抽奖资格', '答对 3 题通关后即可参与抽奖', { action: 'goto', route: 'quiz', label: '去答题' }) };
  }
  if (elig.drawn) {
    return {
      navbar: '抽奖',
      back: 'home',
      body: `<div class="card center"><div class="prize-icon level-0" style="margin-bottom:8px"></div>
        <div style="font-size:16px;font-weight:500">每人仅可参与一次抽奖</div>
        <div class="tiny muted mt8">你已于 ${esc(state.me.drawnAt || '-')} 完成抽奖</div>
        <button class="btn primary btn-block mt16" data-action="goto" data-route="my-prize">查看我的奖品</button></div>`
    };
  }

  // 扇区须与抽奖算法结局一一对应（中奖 1/2/3 等 或 未中），避免误导评审
  const segs = [
    { name: '一等奖', color: '#BA7517' },
    { name: '二等奖', color: '#378ADD' },
    { name: '三等奖', color: '#639922' },
    { name: '谢谢参与', color: '#B4B2A9' }
  ];
  const n = segs.length;
  return {
    navbar: '抽奖',
    back: 'home',
    body: `
      <div class="card center">
        <div class="tiny muted mb8">通关达成，获得 1 次抽奖机会</div>
        <div class="wheel-wrap">
          <div class="wheel" id="wheel" style="background:conic-gradient(${segs.map((s, i) => `${s.color} ${(i * 360) / n}deg ${((i + 1) * 360) / n}deg`).join(',')})">
            ${segs.map((s, i) => `<div class="wheel-item" style="transform:rotate(${(i * 360) / n + 180 / n - 90}deg)"><span>${esc(s.name)}</span></div>`).join('')}
          </div>
          <div class="pointer">抽奖</div>
        </div>
        ${poolEmpty
          ? `<div class="form-error">奖品已全部送出，感谢参与！</div>`
          : `<button class="btn primary btn-block" data-action="do-draw">开始抽奖</button>`}
      </div>
      <div class="card">
        <div class="tiny muted mb8">奖品池余量</div>
        ${stats.prizes.map((p) => `<div class="row between mb8"><span class="tiny">${esc(p.name)}</span><span class="tiny">${p.remain} / ${p.total}</span></div>`).join('')}
      </div>
      <div class="tiny muted center">总中奖概率 25%，每人仅可抽奖一次</div>`
  };
}

async function render() {
  const vp = $('#viewport');

function parseCsv(text) {
  const lines = String(text).trim().split(/\r?\n/).filter(Boolean);
  if (lines.length < 2) return [];
  const heads = lines[0].split(/[,\t]/).map((s) => s.trim());
  return lines.slice(1).map((line) => {
    const cells = line.split(/[,\t]/).map((s) => s.trim());
    const row = {};
    heads.forEach((h, i) => (row[h] = cells[i] ?? ''));
    return row;
  });
}

/* ============================================================
 * 8. 事件总线
 * ==========================================================*/
async function onAction(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const route = el.dataset.route;

  // ---- 导航 ----
  if (a === 'goto') return goto(route);
  if (a === 'go-register') return goto('register');

  // ---- 端切换 ----
  if (a === 'switch-side') {
    state.side = el.dataset.side;
    state.route = state.side === 'c' ? 'home' : 'admin-login';
    return goto(state.route);
  }

  // ---- 登记 ----
  if (a === 'fill-demo') {
    $('#ipt-name').value = el.dataset.name;
    $('#ipt-emp').value = el.dataset.emp;
    return;
  }
  if (a === 'submit-register') {
    const name = $('#ipt-name').value.trim();
    const emp = $('#ipt-emp').value.trim();
    let ok = true;
    $('#f-name').classList.toggle('invalid', !(name.length >= 2 && name.length <= 10));
    if (!(name.length >= 2 && name.length <= 10)) ok = false;
    $('#f-emp').classList.toggle('invalid', !/^[A-Za-z0-9]{4,12}$/.test(emp));
    if (!/^[A-Za-z0-9]{4,12}$/.test(emp)) ok = false;
    if (!ok) return;
    try {
      const res = await call(() => Data.register(name, emp), { loading: '登记中…' });
      state.me = res.participant;
      if (res.warning) toast(res.warning, 'err');
      toast(res.reused ? '已识别你的身份' : '登记成功', 'ok');
      goto('quiz');
    } catch (_) {}
    return;
  }
  if (a === 'reset-me') {
    Data.logoutParticipant();
    state.me = null;
    state.quiz = null;
    state.lottery = null;
    toast('已退出身份');
    return goto('home');
  }

  // ---- 答题 ----
  if (a === 're-quiz') {
    state.quiz = null; // 清空会话，下次进入重新抽题
    return goto('quiz');
  }
  if (a === 'pick') {
    state.quiz.answers[state.quiz.index] = el.dataset.key;
    return render();
  }
  if (a === 'prev-q') {
    if (state.quiz.index > 0) state.quiz.index--;
    return render();
  }
  if (a === 'next-q') {
    if (state.quiz.index < state.quiz.questions.length - 1) state.quiz.index++;
    return render();
  }
  if (a === 'submit-quiz') {
    const q = state.quiz;
    if (q.answers.some((x) => x === null)) return toast('还有题目未作答', 'err');
    try {
      const r = await call(() => Data.submitExam(q.questions.map((x) => x.no), q.answers), { loading: '正在判分…' });
      q.result = r;
      state.me = r.participant;
      goto('quiz-result');
    } catch (_) {}
    return;
  }

  // ---- 抽奖 ----
  if (a === 'do-draw') {
    const btn = el;
    btn.disabled = true;
    btn.textContent = '抽奖中…';
    const wheel = $('#wheel');
    let deg = 0;
    wheel.style.transition = 'none';
    const timer = setInterval(() => {
      deg += 14;
      wheel.style.transform = `rotate(${deg}deg)`;
    }, 16);
    try {
      const r = await Data.drawLottery();
      clearInterval(timer);
      state.lottery = r;
      const n = 4; // 与 pageLottery 扇区数一致，保证转盘停在中奖对应扇区
      const idx = r.level ? r.level - 1 : 3;
      const target = (360 - (idx + 0.5) * (360 / n) + 360) % 360;
      const delta = ((target - (deg % 360)) % 360 + 360) % 360 + 720;
      wheel.style.transition = 'transform 1.8s cubic-bezier(.12,.85,.32,1)';
      wheel.style.transform = `rotate(${deg + delta}deg)`;
      setTimeout(() => goto('lottery-result'), 2000);
    } catch (err) {
      clearInterval(timer);
      btn.disabled = false;
      btn.textContent = '开始抽奖';
      toast(err.message || '抽奖失败', 'err');
    }
    return;
  }

  // ---- 后台登录 ----
  if (a === 'admin-login-submit') {
    const u = $('#adm-user').value.trim();
    const p = $('#adm-pass').value;
    try {
      await call(() => Data.adminLogin(u, p), { loading: '登录中…' });
      toast('登录成功', 'ok');
      goto('admin-dashboard');
    } catch (_) {}
    return;
  }
  if (a === 'admin-logout') {
    Data.adminLogout();
    state.admin = null;
    return goto('admin-login');
  }

  // ---- 题库管理 ----
  if (a === 'q-search') {
    adminState.q.keyword = $('#q-kw').value.trim();
    adminState.q.page = 1;
    return render();
  }
  if (a === 'q-page') {
    adminState.q.page = Math.max(1, Number(el.dataset.p));
    return render();
  }
  if (a === 'q-toggle') {
    try {
      await Data.toggleQuestion(el.dataset.no, el.dataset.enabled === '1');
      toast('已更新', 'ok');
      render();
    } catch (_) {}
    return;
  }
  if (a === 'q-import-open') return openImportModal();
  if (a === 'q-import-close') return closeModal();
  if (a === 'q-import-demo') {
    $('#imp-text').value = window.__demoCsv;
    return;
  }
  if (a === 'q-import-confirm') {
    const rows = parseCsv($('#imp-text').value);
    const mode = $('#imp-mode').value;
    try {
      const res = await call(() => Data.importQuestions(rows, mode), { loading: '正在导入…' });
      closeModal();
      adminState.q.page = 1;
      if (res.failed === 0) {
        toast(`导入成功 ${res.success} 条`, 'ok');
      } else {
        openModal(`
          <div class="modal-head"><h3>导入完成（部分失败）</h3><button class="btn" data-action="q-import-close">✕</button></div>
          <div class="modal-body">
            <div class="row gap12 mb12">
              <span class="badge green">成功 ${res.success} 条</span>
              <span class="badge red">失败 ${res.failed} 条</span>
            </div>
            <table class="tbl"><thead><tr><th style="width:70px">行号</th><th>失败原因</th></tr></thead>
              <tbody>${res.errors.map((x) => `<tr><td>${x.lineNo}</td><td class="tiny">${esc(x.reason)}</td></tr>`).join('')}</tbody></table>
          </div>
          <div class="modal-foot"><button class="btn primary" data-action="q-import-close">知道了</button></div>`);
      }
      render();
    } catch (_) {}
    return;
  }

  // ---- 奖品配置 ----
  if (a === 'prize-save') {
    try {
      const rate = Number($('#cfg-rate').value);
      if (!(rate >= 0 && rate <= 1)) return toast('中奖概率应在 0 到 1 之间', 'err');
      await call(() => Data.updateActivity({ winRate: rate, weightMode: $('#cfg-mode').value, poolEmptyBehavior: $('#cfg-empty').value }), { loading: '保存中…' });
      for (const el2 of document.querySelectorAll('[data-prize-total]')) {
        await Data.updatePrize(el2.dataset.prizeTotal, { total: Number(el2.value) });
      }
      for (const el2 of document.querySelectorAll('[data-prize-remain]')) {
        await Data.updatePrize(el2.dataset.prizeRemain, { remain: Number(el2.value) });
      }
      toast('配置已保存', 'ok');
      render();
    } catch (_) {}
    return;
  }

  // ---- 名单 ----
  if (a === 'w-search') {
    adminState.w.keyword = $('#w-kw').value.trim();
    return render();
  }
  if (a === 'w-filter') {
    adminState.w.level = $('#w-lv').value;
    return render();
  }
  if (a === 'w-page') {
    adminState.w.page = Math.max(1, Number(el.dataset.p));
    return render();
  }
  if (a === 'w-export') {
    const csv = await Data.exportWinnersCsv();
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a2 = document.createElement('a');
    a2.href = url;
    a2.download = `获奖名单_${new Date().toISOString().slice(0, 10)}.csv`;
    a2.click();
    URL.revokeObjectURL(url);
    toast('已导出 CSV', 'ok');
    return;
  }

  // ---- 顶栏 ----
  if (a === 'toggle-anno') {
    state.annoOpen = !state.annoOpen;
    renderSidePanels();
    $('#btnAnno').classList.toggle('on', state.annoOpen);
    return;
  }
  if (a === 'toggle-debug') {
    state.debugOpen = !state.debugOpen;
    renderSidePanels();
    $('#btnDebug').classList.toggle('on', state.debugOpen);
    return;
  }

  // ---- 调试面板 ----
  if (a === 'dbg-force-error') { state.forceError = true; return toast('已设置：下次请求将失败'); }
  if (a === 'dbg-clear-questions') {
    TEST_UTILS.reset();
    const all = await Data.listQuestions({ pageSize: 9999 });
    for (const q of all.list) await Data.deleteQuestion(q.no);
    toast('题库已清空，切到题库管理查看空状态', 'ok');
    return render();
  }
  if (a === 'dbg-clear-winners') {
    TEST_UTILS.reset();
    state.me = null;
    state.quiz = null;
    state.lottery = null;
    toast('数据已重置（名单为空）', 'ok');
    return render();
  }
  if (a === 'dbg-see-skeleton') {
    const vp = $('#viewport');
    vp.innerHTML = `<div class="phone"><div class="phone-screen"><div class="statusbar"><span>9:41</span><span>5G</span></div>
      <div class="navbar"><div class="title">加载态</div></div>
      <div class="page-body">${skeleton(4)}</div>${loadingMask()}</div></div>`;
    $('#loadingMask').style.display = 'flex';
    $('#loadingMask').querySelector('.loading-text').textContent = '正在加载…';
    setTimeout(() => render(), 2200);
    return;
  }
  if (a === 'dbg-drain-1') {
    TEST_UTILS.drainPrize(1);
    toast('一等奖库存已清零，去抽奖不会中一等奖', 'ok');
    return render();
  }
  if (a === 'dbg-drain-all') {
    [1, 2, 3].forEach((l) => TEST_UTILS.drainPrize(l));
    toast('全部奖品已清零，抽奖页将提示已全部送出', 'ok');
    return render();
  }
  if (a === 'dbg-sim') {
    const r = TEST_UTILS.simulateDraws(2000);
    await render(); // 先重建面板，再写入结果
    const out = $('#dbgOut');
    if (out) {
      out.innerHTML = `模拟 ${r.times} 次：中奖 ${r.won} 次（${(r.actualWinRate * 100).toFixed(2)}%）<br>
        一等 ${r.byLevel[1]} / 二等 ${r.byLevel[2]} / 三等 ${r.byLevel[3]}<br>
        超发 <b style="color:${r.oversold ? '#F09595' : '#97C459'}">${r.oversold}</b> 件 · 降级 ${r.fallback} 次<br>
        剩余：${r.remain.map((x) => `${x.level}等${x.remain}`).join(' ')}<br>
        <span style="color:#888780">模拟会消耗真实奖池，如需重来请点「重置全部数据」</span>`;
    }
    toast('模拟完成', 'ok');
    return;
  }
  if (a === 'dbg-reset') {
    TEST_UTILS.reset();
    state.me = null;
    state.quiz = null;
    state.lottery = null;
    toast('全部数据已重置', 'ok');
    return render();
  }
  if (a === 'dbg-seed') {
    const p = TEST_UTILS.seedParticipant('快捷测试', 'T' + Math.floor(1000 + Math.random() * 8999), { passed: true });
    state.me = p;
    toast(`已生成测试身份 ${p.name} / ${p.empNo}（已通关未抽奖）`, 'ok');
    return render();
  }
}

/* ============================================================
 * 9. 启动
 * ==========================================================*/
async function init() {
  state.me = await Data.currentParticipant();
  state.route = location.hash.replace('#/', '') || 'home';
  document.addEventListener('click', onAction);
  $('#btnAnno').setAttribute('data-action', 'toggle-anno');
  $('#btnDebug').setAttribute('data-action', 'toggle-debug');
  render();
}
init();
</script>
